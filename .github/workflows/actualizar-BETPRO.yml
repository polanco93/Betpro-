name: Actualizar datos BETPRO

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener fútbol real
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const KEY = process.env.API_FOOTBALL_KEY;
          if (!KEY) throw new Error("Falta el secreto API_FOOTBALL_KEY");

          const BASE = "https://v3.football.api-sports.io";

          const ligas = [
            [140, "LaLiga"],
            [39, "Premier League"],
            [135, "Serie A"],
            [78, "Bundesliga"],
            [141, "Segunda División"]
          ];

          const temporada = 2026;

          async function pedir(url) {
            const r = await fetch(url);
            const j = await r.json();

            if (!r.ok || (j.errors && Object.keys(j.errors).length)) {
              throw new Error(JSON.stringify(j.errors || { http: r.status }));
            }

            return j.response || [];
          }

          (async () => {
            const juegos = [];

            for (const [id, nombre] of ligas) {
              for (const tipo of ["last=60", "next=10"]) {
                try {
                  const url = `${BASE}/fixtures?league=${id}&season=${temporada}&${tipo}`;

                  const r = await fetch(url, {
                    headers: {
                      "x-apisports-key": KEY
                    }
                  });

                  const j = await r.json();

                  if (!r.ok || (j.errors && Object.keys(j.errors).length)) {
                    throw new Error(JSON.stringify(j.errors || { http: r.status }));
                  }

                  const partidos = j.response || [];

                  for (const x of partidos) {
                    juegos.push({
                      id: x.fixture.id,
                      liga: nombre,
                      fecha: x.fixture.date,
                      estado: x.fixture.status.short,
                      inicio: x.teams.home.name,
                      visitante: x.teams.away.name,
                      homeScore: x.goals.home,
                      awayScore: x.goals.away
                    });
                  }

                  console.log(`${nombre} ${tipo}: ${partidos.length} partidos`);
                } catch (e) {
                  console.log(`ERROR ${nombre} ${tipo}: ${e.message}`);
                }
              }
            }

            const unicos = [...new Map(juegos.map(x => [x.id, x])).values()]
              .sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

            if (!unicos.length) {
              throw new Error("La API no devolvió partidos. Revisa API_FOOTBALL_KEY.");
            }

            fs.mkdirSync("datos", { recursive: true });

            fs.writeFileSync(
              "datos/fútbol.json",
              JSON.stringify({
                actualizadoEn: new Date().toISOString(),
                fuente: "API-Football",
                temporada,
                juegos: unicos
              }, null, 2)
            );

            console.log(`BETPRO: ${unicos.length} partidos guardados`);
          })();
          NODE

      - name: Guardar datos
        run: |
          git config user.name "BETPRO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "datos/fútbol.json"
          git diff --cached --quiet || git commit -m "Actualizar datos de fútbol"
          git push
