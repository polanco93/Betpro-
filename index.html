<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BETPRO — Análisis de fútbol</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eef3f8;font-family:Arial,sans-serif}
header{padding:22px 18px;border-bottom:1px solid #263246;background:#101a2b}
h1{margin:0;font-size:28px}p{color:#9eabbc}.wrap{max-width:1050px;margin:auto;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:#111c2e;border:1px solid #263246;border-radius:14px;padding:18px}
.big{font-size:30px;font-weight:700}.muted{color:#9eabbc}
.match{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #263246}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#1c2b43;color:#b9c8dc;font-size:12px}
</style>
</head>
<body>
<header><div class="wrap"><h1>⚽ BETPRO</h1><p>Análisis y probabilidades estadísticas de fútbol</p></div></header>
<main class="wrap">
<section class="grid">
<div class="card"><div class="muted">Partidos cargados</div><div id="total" class="big">—</div></div>
<div class="card"><div class="muted">Fuente</div><div id="fuente" class="big" style="font-size:20px">—</div></div>
<div class="card"><div class="muted">Actualización</div><div id="fecha" class="big" style="font-size:18px">—</div></div>
</section>
<div class="card" style="margin-top:14px">
<h2>Próximos partidos</h2>
<div id="partidos"><p>Cargando datos reales…</p></div>
<div id="estado" class="muted"></div>
</div>
</main>
<script>
async function cargar(){
  try{
    const r=await fetch('datos/fútbol.json?'+Date.now());
    if(!r.ok) throw new Error('Aún no hay datos publicados');
    const d=await r.json(), juegos=Array.isArray(d.juegos)?d.juegos:[];
    document.querySelector('#total').textContent=juegos.length;
    document.querySelector('#fuente').textContent=d.fuente||'Datos';
    document.querySelector('#fecha').textContent=d.actualizadoEn?new Date(d.actualizadoEn).toLocaleString('es-ES'):'—';
    const box=document.querySelector('#partidos'); box.innerHTML='';
    juegos.slice(0,20).forEach(x=>{
      const el=document.createElement('div'); el.className='match';
      el.innerHTML='<div><span class="badge">'+(x.liga||'Fútbol')+'</span><br><b>'+x.inicio+'</b><br>vs <b>'+x.visitante+'</b></div><div class="muted">'+new Date(x.fecha).toLocaleString('es-ES')+'</div>';
      box.appendChild(el);
    });
    if(!juegos.length) box.innerHTML='<p>No hay partidos disponibles.</p>';
  }catch(e){
    document.querySelector('#partidos').innerHTML='<p>BETPRO está preparado para recibir datos reales.</p>';
    document.querySelector('#estado').textContent=e.message;
  }
}
cargar();
</script>
</body>
</html>
